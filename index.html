<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>One Shot FPS</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07140a;
    font-family:Arial,sans-serif;
}

#game{
    position:absolute;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
}

#hud{
    position:absolute;
    left:20px;
    bottom:20px;
    color:white;
    font-size:20px;
    text-shadow:0 2px 6px #000;
    z-index:5;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:24px;
    z-index:5;
    text-shadow:0 0 6px #000;
}

#ammo{
    position:absolute;
    right:28px;
    bottom:24px;
    color:white;
    font-size:32px;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
    z-index:8;
}

#weaponName{
    position:absolute;
    right:30px;
    bottom:65px;
    color:#ddd;
    font-size:14px;
    letter-spacing:2px;
    text-shadow:0 2px 5px #000;
    z-index:8;
}

#reloadText{
    position:absolute;
    left:50%;
    bottom:17%;
    transform:translateX(-50%);
    color:white;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 2px 7px #000;
    display:none;
    z-index:8;
}

#menu{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,20,8,.72);
    color:white;
    z-index:10;
}

#menu h1{
    font-size:60px;
    margin:0 0 10px;
    letter-spacing:5px;
    text-shadow:0 5px 25px #000;
}

#menu p{
    font-size:18px;
    margin:8px;
}

#name{
    padding:12px;
    width:230px;
    border:0;
    border-radius:6px;
    margin:12px;
    font-size:16px;
}

#start{
    padding:12px 35px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

#error{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    color:#ff7777;
    z-index:20;
}


/* =========================================================
   ESC AYARLAR
========================================================= */

#settings{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.82);
    color:white;
    z-index:100;
}

#settingsPanel{
    width:380px;
    padding:30px;
    border-radius:12px;
    background:rgba(10,18,12,.97);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 20px 70px #000;
    text-align:center;
}

#settingsPanel h2{
    margin:0 0 25px;
    font-size:30px;
}

#sensitivityLabel{
    display:block;
    margin-bottom:15px;
    font-size:18px;
}

#sensitivity{
    width:100%;
    cursor:pointer;
}

#sensitivityValue{
    display:block;
    margin-top:12px;
    font-size:24px;
    font-weight:bold;
}

#closeSettings{
    width:100%;
    margin-top:25px;
    padding:12px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
}


/* =========================================================
   BÜYÜK KURGUSAL TÜFEK
========================================================= */

#weapon{
    position:absolute;
    right:-75px;
    bottom:-75px;

    width:700px;
    height:470px;

    pointer-events:none;
    z-index:6;

    transform-origin:82% 90%;
    transform:rotate(-2deg) scale(1.25);

    transition:transform .06s;
}

.gun-body{
    position:absolute;
    right:115px;
    bottom:155px;
    width:390px;
    height:95px;

    background:
        linear-gradient(
            180deg,
            #555b5c 0%,
            #34393a 18%,
            #191d1e 55%,
            #0a0d0e 100%
        );

    border-radius:12px 25px 12px 9px;
    transform:rotate(-5deg);

    box-shadow:
        0 14px 25px rgba(0,0,0,.75),
        inset 0 4px 6px rgba(255,255,255,.10),
        inset 0 -7px 9px rgba(0,0,0,.65);
}

.gun-body::before{
    content:"";
    position:absolute;
    left:30px;
    top:13px;
    width:270px;
    height:9px;
    background:#080b0c;
    border-radius:5px;

    box-shadow:
        45px 0 0 #111516,
        90px 0 0 #111516,
        135px 0 0 #111516;
}

.gun-body::after{
    content:"";
    position:absolute;
    right:25px;
    bottom:11px;
    width:130px;
    height:9px;
    background:#080a0b;
    border-radius:5px;
}

.gun-top{
    position:absolute;
    right:185px;
    bottom:248px;
    width:285px;
    height:18px;

    background:
        repeating-linear-gradient(
            90deg,
            #080a0b 0px,
            #080a0b 13px,
            #292e2f 14px,
            #292e2f 18px
        );

    border-radius:5px;
    transform:rotate(-5deg);

    box-shadow:
        0 5px 8px rgba(0,0,0,.6);
}

.gun-barrel{
    position:absolute;
    right:-15px;
    bottom:187px;
    width:265px;
    height:25px;

    background:
        linear-gradient(
            180deg,
            #666b6b,
            #353a3b 35%,
            #15191a 75%,
            #080a0b
        );

    transform:rotate(-5deg);

    border-radius:
        4px 16px 16px 4px;

    box-shadow:
        0 9px 15px rgba(0,0,0,.7);
}

.gun-muzzle{
    position:absolute;
    right:-20px;
    bottom:184px;
    width:43px;
    height:30px;

    background:
        linear-gradient(
            90deg,
            #07090a,
            #323738
        );

    transform:rotate(-5deg);

    border-radius:
        3px 10px 10px 3px;

    box-shadow:
        inset 0 4px 5px rgba(255,255,255,.08);
}

.gun-front{
    position:absolute;
    right:405px;
    bottom:105px;
    width:65px;
    height:125px;

    background:
        linear-gradient(
            90deg,
            #080b0c,
            #353a3b 45%,
            #101415
        );

    transform:rotate(11deg);

    border-radius:
        7px 7px 19px 19px;

    box-shadow:
        0 12px 18px rgba(0,0,0,.7);
}

.gun-mag{
    position:absolute;
    right:300px;
    bottom:45px;
    width:72px;
    height:170px;

    background:
        linear-gradient(
            90deg,
            #090c0d,
            #393f40 45%,
            #111516
        );

    border-radius:
        7px 7px 28px 28px;

    transform:rotate(19deg);

    box-shadow:
        0 14px 22px rgba(0,0,0,.75);
}

.gun-grip{
    position:absolute;
    right:390px;
    bottom:8px;
    width:78px;
    height:165px;

    background:
        linear-gradient(
            90deg,
            #090c0d,
            #343a3b 45%,
            #0d1112
        );

    border-radius:
        10px 10px 23px 23px;

    transform:rotate(9deg);

    box-shadow:
        0 14px 20px rgba(0,0,0,.7);
}

.gun-trigger{
    position:absolute;
    right:350px;
    bottom:130px;
    width:85px;
    height:50px;

    border:
        8px solid #080a0b;

    border-top:0;

    border-radius:
        0 0 40px 40px;

    transform:rotate(8deg);
}

.gun-stock{
    position:absolute;
    right:475px;
    bottom:150px;
    width:190px;
    height:95px;

    background:
        linear-gradient(
            180deg,
            #303536,
            #171b1c 55%,
            #0a0d0e
        );

    transform:rotate(-7deg);

    border-radius:
        24px 7px 10px 24px;

    box-shadow:
        0 13px 22px rgba(0,0,0,.7);
}

.gun-stock::after{
    content:"";
    position:absolute;
    left:20px;
    top:22px;
    width:90px;
    height:8px;
    background:#090b0c;
    border-radius:5px;
}

.gun-hand{
    position:absolute;
    right:350px;
    bottom:-2px;
    width:145px;
    height:92px;

    background:
        linear-gradient(
            135deg,
            #c9926c,
            #a96e50 55%,
            #87523e
        );

    border-radius:
        48% 45% 35% 35%;

    transform:rotate(-9deg);

    box-shadow:
        0 10px 18px rgba(0,0,0,.7);
}

.gun-hand2{
    position:absolute;
    right:75px;
    bottom:67px;
    width:155px;
    height:90px;

    background:
        linear-gradient(
            135deg,
            #c9926c,
            #a96e50 55%,
            #87523e
        );

    border-radius:50%;

    transform:rotate(-13deg);

    box-shadow:
        0 10px 18px rgba(0,0,0,.7);
}

.gun-hand::after{
    content:"";
    position:absolute;
    left:22px;
    top:20px;
    width:95px;
    height:9px;
    background:
        rgba(90,45,32,.35);
    border-radius:10px;
    transform:rotate(-8deg);

    box-shadow:
        0 15px 0 rgba(90,45,32,.25),
        0 30px 0 rgba(90,45,32,.18);
}

#muzzleFlash{
    position:absolute;
    right:-45px;
    bottom:155px;
    width:180px;
    height:135px;
    display:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,220,1) 0%,
            rgba(255,210,65,.95) 18%,
            rgba(255,90,20,.55) 43%,
            rgba(255,0,0,0) 75%
        );

    filter:blur(2px);
    transform:rotate(-5deg);
}

.flashActive #muzzleFlash{
    display:block;
}

#weapon.recoil{
    transform:
        translate(-20px,20px)
        rotate(2deg)
        scale(1.25);
}

#weapon.reload{
    transform:
        translateY(90px)
        rotate(13deg)
        scale(1.25);
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="crosshair">+</div>

<div id="hud">
    HP: <span id="hp">100</span>
    <br>
    Oyuncular: <span id="players">1</span>
</div>

<div id="weaponName">
    One Shot FPS
</div>

<div id="ammo">
    <span id="ammoCurrent">30</span>
    /
    <span id="ammoReserve">90</span>
</div>

<div id="reloadText">
    ŞARJÖR YENİLENİYOR...
</div>


<div id="weapon">

    <div class="gun-stock"></div>
    <div class="gun-top"></div>
    <div class="gun-body"></div>
    <div class="gun-barrel"></div>
    <div class="gun-muzzle"></div>
    <div class="gun-front"></div>
    <div class="gun-trigger"></div>
    <div class="gun-mag"></div>
    <div class="gun-grip"></div>
    <div class="gun-hand"></div>
    <div class="gun-hand2"></div>
    <div id="muzzleFlash"></div>

</div>


<div id="error"></div>


<div id="menu">

    <h1>One Shot FPS</h1>

    <p>Çok Oyunculu FPS</p>

    <input
        id="name"
        placeholder="Oyuncu adı"
        maxlength="16"
    >

    <button id="start">
        OYUNA BAŞLA
    </button>

    <p>
        WASD: Hareket • Mouse: Bakış •
        SPACE: Zıpla • CTRL: Eğil
    </p>

    <p>
        Sol Tık: Ateş • R: Şarjör
    </p>

</div>


<!-- ESC AYAR MENÜSÜ -->

<div id="settings">

    <div id="settingsPanel">

        <h2>AYARLAR</h2>

        <label id="sensitivityLabel">
            Hassasiyet
        </label>

        <input
            id="sensitivity"
            type="range"
            min="1"
            max="100"
            value="50"
        >

        <span id="sensitivityValue">
            50
        </span>

        <button id="closeSettings">
            DEVAM ET
        </button>

    </div>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;


function resize(){

    W =
        canvas.width =
        innerWidth;

    H =
        canvas.height =
        innerHeight;
}

addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   HARİTA
========================================================= */

const MAP_W = 29;
const MAP_H = 29;

const map =
    Array.from(
        {length:MAP_H},
        ()=>Array(MAP_W).fill("0")
    );


for(let x=0;x<MAP_W;x++){

    map[0][x]="1";
    map[MAP_H-1][x]="1";
}


for(let y=0;y<MAP_H;y++){

    map[y][0]="1";
    map[y][MAP_W-1]="1";
}


function makeBase(
    x1,
    y1,
    x2,
    y2
){

    for(
        let x=x1;
        x<=x2;
        x++
    ){

        map[y1][x]="1";
        map[y2][x]="1";
    }


    for(
        let y=y1;
        y<=y2;
        y++
    ){

        map[y][x1]="1";
        map[y][x2]="1";
    }
}


makeBase(1,1,7,7);

map[4][7]="0";


makeBase(21,21,27,27);

map[24][21]="0";


for(
    let y=9;
    y<=16;
    y++
){

    map[y][9]="1";
}

map[12][9]="0";
map[13][9]="0";


for(
    let x=11;
    x<=20;
    x++
){

    map[8][x]="1";
}

map[8][15]="0";
map[8][16]="0";


for(
    let x=5;
    x<=17;
    x++
){

    map[17][x]="1";
}

map[17][10]="0";
map[17][11]="0";


for(
    let y=10;
    y<=19;
    y++
){

    map[y][19]="1";
}

map[14][19]="0";
map[15][19]="0";


for(
    let x=10;
    x<=19;
    x++
){

    map[20][x]="1";
}

map[20][14]="0";
map[20][15]="0";


function isWall(x,y){

    const mx =
        Math.floor(x);

    const my =
        Math.floor(y);


    if(
        my < 0 ||
        my >= map.length
    )
        return true;


    if(
        mx < 0 ||
        mx >= map[my].length
    )
        return true;


    return map[my][mx] === "1";
}


/* =========================================================
   OYUNCU
========================================================= */

const player = {

    x:4.5,
    y:4.5,

    angle:0,

    pitch:0,

    hp:100,

    id:null,

    name:"Oyuncu",

    z:0,

    velocityZ:0,

    grounded:true,

    crouching:false
};


/* =========================================================
   KAMERA
========================================================= */

let cameraOffset = 0;

let crosshairOffset = 0;

const MAX_PITCH = 260;


/* =========================================================
   KONTROLLER
========================================================= */

let keys = {};

let mouseLocked = false;

let mouseDown = false;

let lastTime =
    performance.now();


/* =========================================================
   SİLAH
========================================================= */

const weapon = {

    magazineSize:30,

    ammo:30,

    reserve:90,

    fireRate:105,

    lastShot:0,

    reloading:false,

    reloadTime:1300,

    recoil:0
};


const weaponElement =
    document.getElementById(
        "weapon"
    );


const reloadText =
    document.getElementById(
        "reloadText"
    );


function updateAmmo(){

    document.getElementById(
        "ammoCurrent"
    ).textContent =
        weapon.ammo;


    document.getElementById(
        "ammoReserve"
    ).textContent =
        weapon.reserve;
}


updateAmmo();


/* =========================================================
   ESC + HASSASİYET
========================================================= */

let settingsOpen = false;

let sensitivity =
    Number(
        localStorage.getItem(
            "one_shot_fps_sensitivity"
        )
    ) || 50;

const settings =
    document.getElementById(
        "settings"
    );

const sensitivitySlider =
    document.getElementById(
        "sensitivity"
    );

const sensitivityValue =
    document.getElementById(
        "sensitivityValue"
    );

const closeSettings =
    document.getElementById(
        "closeSettings"
    );


sensitivitySlider.value =
    sensitivity;

sensitivityValue.textContent =
    sensitivity;


sensitivitySlider.addEventListener(
    "input",
    ()=>{
        
        sensitivity =
            Number(
                sensitivitySlider.value
            );

        sensitivityValue.textContent =
            sensitivity;

        localStorage.setItem(
            "one_shot_fps_sensitivity",
            sensitivity
        );
    }
);


function openSettings(){

    if(!connected)
        return;

    settingsOpen = true;

    settings.style.display =
        "flex";

    if(
        document.pointerLockElement ===
        canvas
    ){

        document.exitPointerLock();
    }

    mouseDown = false;
}


function closeSettingsMenu(){

    settingsOpen = false;

    settings.style.display =
        "none";

    canvas.requestPointerLock();
}


document.addEventListener(
    "keydown",
    e=>{

        if(e.key === "Escape"){

            if(settingsOpen){

                closeSettingsMenu();

            }else{

                openSettings();

            }

        }

    }
);


closeSettings.addEventListener(
    "click",
    ()=>{
        closeSettingsMenu();
    }
);


/* =========================================================
   KLAVYE
========================================================= */

addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ] = true;


        if(
            e.code === "ControlLeft" ||
            e.code === "ControlRight"
        ){

            player.crouching = true;
        }


        if(
            e.code === "Space" &&
            player.grounded &&
            !player.crouching
        ){

            e.preventDefault();

            player.velocityZ = 6.2;

            player.grounded = false;
        }


        if(
            e.key.toLowerCase() === "r"
        ){

            reloadWeapon();
        }

    }
);


addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ] = false;


        if(
            e.code === "ControlLeft" ||
            e.code === "ControlRight"
        ){

            player.crouching = false;
        }

    }
);


/* =========================================================
   MOUSE
========================================================= */

canvas.addEventListener(
    "mousedown",
    e=>{

        if(e.button !== 0)
            return;


        if(!mouseLocked){

            canvas.requestPointerLock();

            return;
        }


        mouseDown = true;

        shoot();
    }
);


document.addEventListener(
    "mouseup",
    e=>{

        if(e.button === 0){

            mouseDown = false;
        }

    }
);


document.addEventListener(
    "pointerlockchange",
    ()=>{

        mouseLocked =
            document.pointerLockElement ===
            canvas;


        if(!mouseLocked){

            mouseDown = false;
        }

    }
);


document.addEventListener(
    "mousemove",
    e=>{

        if(!mouseLocked)
            return;

        if(settingsOpen)
            return;


        player.angle +=
            e.movementX *
            0.0025 *
            (sensitivity / 50);


        player.pitch -=
            e.movementY *
            1.15 *
            (sensitivity / 50);


        player.pitch =
            Math.max(
                -MAX_PITCH,
                Math.min(
                    MAX_PITCH,
                    player.pitch
                )
            );

    }
);


/* =========================================================
   ATEŞ
========================================================= */

function shoot(){

    if(!connected)
        return;


    if(weapon.reloading)
        return;


    const now =
        performance.now();


    if(
        now - weapon.lastShot <
        weapon.fireRate
    )
        return;


    if(weapon.ammo <= 0){

        reloadWeapon();

        return;
    }


    weapon.lastShot = now;

    weapon.ammo--;

    updateAmmo();


    weapon.recoil = 1;

    weaponElement.classList.add(
        "recoil"
    );


    setTimeout(
        ()=>{

            weaponElement.classList.remove(
                "recoil"
            );

        },
        55
    );


    weaponElement.classList.add(
        "flashActive"
    );


    setTimeout(
        ()=>{

            weaponElement.classList.remove(
                "flashActive"
            );

        },
        45
    );


    player.pitch -= 1.8;


    if(
        weapon.ammo <= 0 &&
        weapon.reserve > 0
    ){

        setTimeout(
            reloadWeapon,
            120
        );
    }

}


/* =========================================================
   ŞARJÖR
========================================================= */

function reloadWeapon(){

    if(
        weapon.reloading
    )
        return;


    if(
        weapon.ammo >=
        weapon.magazineSize
    )
        return;


    if(
        weapon.reserve <= 0
    )
        return;


    weapon.reloading = true;


    reloadText.style.display =
        "block";


    weaponElement.classList.add(
        "reload"
    );


    setTimeout(
        ()=>{

            const needed =
                weapon.magazineSize -
                weapon.ammo;


            const amount =
                Math.min(
                    needed,
                    weapon.reserve
                );


            weapon.ammo +=
                amount;


            weapon.reserve -=
                amount;


            weapon.reloading =
                false;


            reloadText.style.display =
                "none";


            weaponElement.classList.remove(
                "reload"
            );


            updateAmmo();

        },
        weapon.reloadTime
    );

}


/* =========================================================
   HAREKET
========================================================= */

function movePlayer(dt){

    const speed =
        player.crouching
        ? 1.8
        : 3.2;


    let dx = 0;
    let dy = 0;


    if(keys["w"]){

        dx +=
            Math.cos(
                player.angle
            )
            * speed
            * dt;


        dy +=
            Math.sin(
                player.angle
            )
            * speed
            * dt;
    }


    if(keys["s"]){

        dx -=
            Math.cos(
                player.angle
            )
            * speed
            * dt;


        dy -=
            Math.sin(
                player.angle
            )
            * speed
            * dt;
    }


    if(keys["a"]){

        dx +=
            Math.cos(
                player.angle -
                Math.PI/2
            )
            * speed
            * dt;


        dy +=
            Math.sin(
                player.angle -
                Math.PI/2
            )
            * speed
            * dt;
    }


    if(keys["d"]){

        dx +=
            Math.cos(
                player.angle +
                Math.PI/2
            )
            * speed
            * dt;


        dy +=
            Math.sin(
                player.angle +
                Math.PI/2
            )
            * speed
            * dt;
    }


    const nx =
        player.x + dx;

    const ny =
        player.y + dy;


    if(
        !isWall(
            nx,
            player.y
        )
    )
        player.x = nx;


    if(
        !isWall(
            player.x,
            ny
        )
    )
        player.y = ny;


    player.velocityZ -=
        16 * dt;


    player.z +=
        player.velocityZ * dt;


    if(player.z <= 0){

        player.z = 0;

        player.velocityZ = 0;

        player.grounded = true;
    }


    let targetCameraOffset =
        player.z * 42;


    if(player.crouching){

        targetCameraOffset -= 22;
    }


    const cameraSmooth =
        1 -
        Math.pow(
            0.0001,
            dt
        );


    cameraOffset +=
        (
            targetCameraOffset -
            cameraOffset
        )
        * cameraSmooth;


    const targetCrosshair =
        player.crouching
        ? 22
        : 0;


    const crosshairSmooth =
        1 -
        Math.pow(
            0.00001,
            dt
        );


    crosshairOffset +=
        (
            targetCrosshair -
            crosshairOffset
        )
        * crosshairSmooth;


    document.getElementById(
        "crosshair"
    ).style.top =
        "calc(50% + " +
        crosshairOffset +
        "px)";

}


/* =========================================================
   RAYCAST
========================================================= */

function castRay(angle){

    const step = 0.02;


    for(
        let d=0;
        d<1600;
        d++
    ){

        const dist =
            d * step;


        const x =
            player.x +
            Math.cos(angle) *
            dist;


        const y =
            player.y +
            Math.sin(angle) *
            dist;


        if(
            isWall(
                x,
                y
            )
        )
            return dist;
    }


    return 35;
}


/* =========================================================
   GÖKYÜZÜ
========================================================= */

function drawSky(t){

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H*.58
        );


    sky.addColorStop(
        0,
        "#4b9dcc"
    );

    sky.addColorStop(
        .35,
        "#86c9e7"
    );

    sky.addColorStop(
        .7,
        "#b9dfdf"
    );

    sky.addColorStop(
        1,
        "#dcebdc"
    );


    ctx.fillStyle = sky;


    ctx.fillRect(
        0,
        0,
        W,
        H*.58
    );


    const sunX =
        W*.78 +
        Math.sin(t*.08)*25;


    const sunY =
        H*.17 +
        Math.sin(t*.12)*8;


    const glow =
        ctx.createRadialGradient(
            sunX,
            sunY,
            5,
            sunX,
            sunY,
            150
        );


    glow.addColorStop(
        0,
        "rgba(255,255,230,.95)"
    );

    glow.addColorStop(
        .25,
        "rgba(255,245,190,.35)"
    );

    glow.addColorStop(
        1,
        "rgba(255,230,150,0)"
    );


    ctx.fillStyle = glow;


    ctx.fillRect(
        sunX-160,
        sunY-160,
        320,
        320
    );


    ctx.fillStyle =
        "#fff5b8";


    ctx.beginPath();


    ctx.arc(
        sunX,
        sunY,
        28,
        0,
        Math.PI*2
    );


    ctx.fill();
}


/* =========================================================
   ZEMİN
========================================================= */

function drawGround(){

    const horizon =
        H*.52 +
        player.pitch;


    const ground =
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );


    ground.addColorStop(
        0,
        "#739d57"
    );

    ground.addColorStop(
        .25,
        "#5d873f"
    );

    ground.addColorStop(
        .55,
        "#426a32"
    );

    ground.addColorStop(
        .8,
        "#2d4e26"
    );

    ground.addColorStop(
        1,
        "#172e18"
    );


    ctx.fillStyle = ground;


    ctx.fillRect(
        0,
        Math.max(
            0,
            horizon
        ),
        W,
        H
    );
}


/* =========================================================
   DUVARLAR
========================================================= */

function drawWalls(t){

    const fov =
        Math.PI / 2;


    const rays =
        Math.floor(
            W/1.5
        );


    for(
        let i=0;
        i<rays;
        i++
    ){

        const cameraX =
            i/rays - .5;


        const angle =
            player.angle +
            cameraX*fov;


        let dist =
            castRay(
                angle
            );


        const correction =
            Math.cos(
                angle -
                player.angle
            );


        dist *= correction;


        dist =
            Math.max(
                .05,
                dist
            );


        const wallHeight =
            Math.min(
                H*1.9,
                H/(dist*.47)
            );


        const x =
            i *
            (W/rays);


        const top =
            H*.52 -
            wallHeight/2 -
            cameraOffset +
            player.pitch;


        const distanceLight =
            Math.max(
                .15,
                1-dist/32
            );


        const sunLight =
            .94 +
            Math.sin(
                t*.35 +
                dist*.04
            )*.03;


        const shade =
            105 *
            distanceLight *
            sunLight;


        const r =
            Math.min(
                155,
                Math.floor(
                    shade+32
                )
            );


        const g =
            Math.min(
                150,
                Math.floor(
                    shade+25
                )
            );


        const b =
            Math.min(
                125,
                Math.floor(
                    shade
                )
            );


        const wallGradient =
            ctx.createLinearGradient(
                x,
                top,
                x,
                top+wallHeight
            );


        wallGradient.addColorStop(
            0,
            "rgb(" +
            Math.min(175,r+25) +
            "," +
            Math.min(165,g+20) +
            "," +
            Math.min(140,b+18) +
            ")"
        );


        wallGradient.addColorStop(
            .45,
            "rgb(" +
            r +
            "," +
            g +
            "," +
            b +
            ")"
        );


        wallGradient.addColorStop(
            1,
            "rgb(" +
            Math.max(20,r-30) +
            "," +
            Math.max(20,g-28) +
            "," +
            Math.max(15,b-25) +
            ")"
        );


        ctx.fillStyle =
            wallGradient;


        ctx.fillRect(
            x,
            top,
            W/rays+.5,
            wallHeight
        );
    }
}


/* =========================================================
   SİS
========================================================= */

function drawFog(){

    const fog =
        ctx.createLinearGradient(
            0,
            H*.35,
            0,
            H*.78
        );


    fog.addColorStop(
        0,
        "rgba(220,240,225,.10)"
    );

    fog.addColorStop(
        .3,
        "rgba(205,230,215,.06)"
    );

    fog.addColorStop(
        .65,
        "rgba(150,190,155,.025)"
    );

    fog.addColorStop(
        1,
        "rgba(100,150,110,0)"
    );


    ctx.fillStyle = fog;


    ctx.fillRect(
        0,
        H*.3,
        W,
        H*.5
    );
}


/* =========================================================
   VİNYET
========================================================= */

function drawVignette(){

    const v =
        ctx.createRadialGradient(
            W/2,
            H/2,
            H*.22,
            W/2,
            H/2,
            H*.85
        );


    v.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    v.addColorStop(
        .7,
        "rgba(0,0,0,.08)"
    );

    v.addColorStop(
        1,
        "rgba(0,0,0,.48)"
    );


    ctx.fillStyle = v;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   DÜNYA
========================================================= */

function drawWorld(time){

    const t =
        time*.001;


    ctx.save();


    drawSky(t);

    drawGround();

    drawWalls(t);

    drawFog();


    ctx.restore();


    drawVignette();
}


/* =========================================================
   SUNUCU
========================================================= */

let connected = false;


async function joinServer(){

    const nameInput =
        document.getElementById(
            "name"
        );


    player.name =
        nameInput.value.trim()
        || "Oyuncu";


    try{

        const response =
            await fetch(
                "/join",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        name:
                        player.name
                    })
                }
            );


        if(!response.ok)
            throw new Error(
                "Sunucu hatası"
            );


        const data =
            await response.json();


        player.id =
            data.id;


        connected = true;


        document.getElementById(
            "menu"
        ).style.display =
            "none";


        canvas.requestPointerLock();


    }catch(err){

        document.getElementById(
            "error"
        ).textContent =
            "Sunucuya bağlanılamadı. server.py çalışıyor mu?";
    }
}


/* =========================================================
   SUNUCUYA POZİSYON
========================================================= */

let sendTimer = 0;


async function sendPosition(){

    if(
        !connected ||
        !player.id
    )
        return;


    try{

        await fetch(
            "/update",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    id:
                    player.id,

                    x:
                    player.x,

                    y:
                    player.y,

                    angle:
                    player.angle,

                    hp:
                    player.hp,

                    name:
                    player.name
                })
            }
        );

    }catch(e){}
}


/* =========================================================
   OYUNCU SAYISI
========================================================= */

async function getState(){

    if(
        !connected ||
        !player.id
    )
        return;


    try{

        const response =
            await fetch(
                "/state?id=" +
                encodeURIComponent(
                    player.id
                )
            );


        if(!response.ok)
            return;


        const data =
            await response.json();


        if(data.players){

            document.getElementById(
                "players"
            ).textContent =
                Object.keys(
                    data.players
                ).length;
        }

    }catch(e){}
}


/* =========================================================
   BAŞLAT
========================================================= */

document.getElementById(
    "start"
).addEventListener(
    "click",
    joinServer
);


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time){

    const dt =
        Math.min(
            .05,
            (time-lastTime)/1000
        );


    lastTime = time;


    if(connected){

        movePlayer(dt);


        if(
            mouseDown &&
            !weapon.reloading
        ){

            shoot();
        }


        sendTimer += dt;


        if(
            sendTimer > .08
        ){

            sendTimer = 0;

            sendPosition();

            getState();
        }
    }


    drawWorld(time);


    document.getElementById(
        "hp"
    ).textContent =
        player.hp;


    requestAnimationFrame(
        gameLoop
    );
}


requestAnimationFrame(
    gameLoop
);

</script>
